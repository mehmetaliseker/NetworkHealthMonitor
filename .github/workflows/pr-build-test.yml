name: PR Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore, Build, Test
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Display environment
        shell: powershell
        run: |
          dotnet --info
          git rev-parse HEAD
          git status --short

      - name: Restore
        shell: powershell
        run: dotnet restore .\NetworkHealthMonitor.sln

      - name: Build Debug
        shell: powershell
        run: dotnet build .\NetworkHealthMonitor.sln --configuration Debug --no-restore

      - name: Build Release
        shell: powershell
        run: dotnet build .\NetworkHealthMonitor.sln --configuration Release --no-restore

      - name: Test Debug
        shell: powershell
        run: |
          dotnet test .\NetworkHealthMonitor.sln `
            --configuration Debug `
            --no-build `
            --logger "trx;LogFileName=tests-debug.trx"

      - name: Test Release
        shell: powershell
        run: |
          dotnet test .\NetworkHealthMonitor.sln `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=tests-release.trx"

      - name: Verify formatting
        shell: powershell
        run: dotnet format .\NetworkHealthMonitor.sln --verify-no-changes --no-restore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-test-reports
          path: |
            **/TestResults/**
          if-no-files-found: warn
          retention-days: 14
